name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-validate:
    name: Test, Lint & Wheel Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Project & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Build Wheel Artifact
        run: |
          python -m build --wheel

      - name: Isolated Wheel Smoke Verification
        run: |
          SMOKE_VENV="${RUNNER_TEMP:-/tmp}/smoke_env"
          rm -rf "$SMOKE_VENV"
          python -m venv "$SMOKE_VENV"
          "$SMOKE_VENV/bin/pip" install --upgrade pip
          "$SMOKE_VENV/bin/pip" install dist/*.whl
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          "$SMOKE_VENV/bin/python" -P -c "
          import os
          import sys
          from pathlib import Path

          repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          venv = Path(sys.prefix).resolve()

          import src
          import src.source
          import src.cdc
          import src.watermark
          import src.normalization
          import src.merge
          import src.cdf

          modules = [
              src,
              src.source,
              src.cdc,
              src.watermark,
              src.normalization,
              src.merge,
              src.cdf,
          ]

          for module in modules:
              module_path = Path(module.__file__).resolve()
              print(f'Verified {module.__name__} loaded from: {module_path}')
              assert repo not in module_path.parents, f'{module.__name__} was loaded from repository: {module_path}'
              assert venv in module_path.parents, f'{module.__name__} was not loaded from smoke venv: {module_path}'

          print('Successfully verified all src modules loaded from isolated wheel site-packages!')
          "
          rm -rf "$SMOKE_VENV" "$SMOKE_DIR"
