name: Databricks Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  bundle-deploy:
    name: Validate and Deploy Declarative Automation Bundle
    runs-on: ubuntu-latest

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools

      - name: Set up Modern Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Declarative Automation Bundle
        run: |
          databricks bundle validate -t ${{ inputs.target }}

      - name: Deploy Declarative Automation Bundle
        run: |
          databricks bundle deploy -t ${{ inputs.target }}
